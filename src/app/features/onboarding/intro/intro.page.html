<ion-content class="ion-padding" fullscreen>
  <div class="intro-container">
    <!-- Header Section -->
    <div class="intro-header">
      <div class="logo-container">
        <img class="intro-logo" src="/assets/intro.png" alt="ASP NYC Logo" />
      </div>
      
      <div class="intro-title">
        <ion-text color="primary">
          <h1>Welcome to ASP NYC</h1>
        </ion-text>
      </div>
    </div>

    <!-- Features Section -->
    <div class="intro-features">
      <div class="feature-card">
        <ion-icon name="calendar-outline" color="primary"></ion-icon>
        <ion-text>
          <h3>Track Suspensions</h3>
          <p>Stay updated on alternate side parking suspensions in NYC</p>
        </ion-text>
      </div>
      
      <div class="feature-card">
        <ion-icon name="time-outline" color="primary"></ion-icon>
        <ion-text>
          <h3>Meter Status</h3>
          <p>Check parking meter status and hours in real-time</p>
        </ion-text>
      </div>
      
      <div class="feature-card">
        <ion-icon name="notifications-outline" color="primary"></ion-icon>
        <ion-text>
          <h3>Smart Alerts</h3>
          <p>Get notified about important parking updates</p>
        </ion-text>
      </div>
    </div>

    <!-- Call to Action -->
    <div class="intro-actions">
      <ion-button 
        expand="block" 
        size="large"
        color="light" 
        class="get-started-btn"
        (click)="continue()">
        Get Started
        <ion-icon name="arrow-forward" slot="end"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>
