<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>ASP NYC</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="switchCalenderView()">
        <ion-icon slot="icon-only" name="calendar-outline"></ion-icon>
      </ion-button>
      <ion-button routerLink="/settings">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content fullscreen>
  <swiper-container #swiper [allowTouchMove]="false" [initialSlide]="activeSlide()">
    <swiper-slide>
      <div class="ion-padding-horizontal">
        <app-horizontal-calendar />
      </div>
    </swiper-slide>
    <swiper-slide>
      <div class="ion-padding">
        <ion-datetime
          #calendar
          [value]="selectedDate()"
          [min]="minDate()"
          [max]="maxDate()"
          [highlightedDates]="highlightedDates()"
          (ionChange)="onChange($event)"
          size="cover"
          mode="md"
          presentation="date"
        />
      </div>
    </swiper-slide>
  </swiper-container>
</ion-content>
