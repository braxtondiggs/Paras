<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" />
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (!isLoading()) {
    <form [formGroup]="settingsForm()">
      @if (!isiOS()) {
        <ion-list-header>
          <ion-label>Notification Preferences</ion-label>
        </ion-list-header>

        <ion-list lines="none" [inset]="true">
          <ion-item>
            <ion-select
              formControlName="today"
              label="Current Day Notification"
              interface="popover"
              aria-label="Current Day Notification"
              placeholder="Select notification timing"
              [helperText]="todayNotificationMessage()"
            >
              <ion-select-option value="none">None</ion-select-option>
              <ion-select-option value="immediately">Immediately</ion-select-option>
              <ion-select-option value="custom">Custom</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-select
              formControlName="nextDay"
              label="Next Day Notification"
              interface="popover"
              aria-label="Next Day Notification"
              placeholder="Select notification timing"
              [helperText]="nextDayNotificationMessage()"
            >
              <ion-select-option value="none">None</ion-select-option>
              <ion-select-option value="immediately">Immediately</ion-select-option>
              <ion-select-option value="custom">Custom</ion-select-option>
            </ion-select>
          </ion-item>
        </ion-list>

        <ion-list [inset]="true">
          <ion-item>
            <ion-checkbox
              formControlName="exceptionOnly"
              (ionChange)="onCheckBoxChange($event, 'exceptionOnly')"
              aria-label="Exception Notifications Only"
              justify="space-between"
            >
              Exception Notifications Only
            </ion-checkbox>
          </ion-item>
          <ion-item>
            <ion-checkbox
              formControlName="weekend"
              (ionChange)="onCheckBoxChange($event, 'weekend')"
              aria-label="Weekend Notifications"
              justify="space-between"
            >
              Weekend Notifications
            </ion-checkbox>
          </ion-item>
        </ion-list>
      }

      <ion-list-header>
        <ion-label>General</ion-label>
      </ion-list-header>

      <ion-list [inset]="true">
        <ion-item>
          <ion-icon name="moon" slot="start" color="medium" aria-hidden="true" />
          <ion-toggle formControlName="darkMode" aria-label="Dark Mode" justify="space-between">
            Dark Mode
          </ion-toggle>
        </ion-item>
      </ion-list>

      <ion-list-header>
        <ion-label>About</ion-label>
      </ion-list-header>

      <ion-list [inset]="true">
        <ion-item button (click)="about()">
          <ion-icon name="information-circle" slot="start" color="medium" aria-hidden="true" />
          <ion-label>About this App</ion-label>
        </ion-item>

        <ion-item button (click)="rate()" detail>
          <ion-icon name="thumbs-up" slot="start" color="medium" aria-hidden="true" />
          <ion-label>Rate Us On The App Store</ion-label>
        </ion-item>

        @if (!isiOS()) {
          <ion-item button (click)="donate()">
            <ion-icon name="heart" slot="start" color="medium" aria-hidden="true" />
            <ion-label>Support Development</ion-label>
          </ion-item>
        }
      </ion-list>
    </form>
  } @else {
    <div class="loading-container ion-padding">
      <ion-skeleton-text [animated]="true" />
      <ion-skeleton-text [animated]="true" />
      <ion-skeleton-text [animated]="true" />
    </div>
  }
</ion-content>
