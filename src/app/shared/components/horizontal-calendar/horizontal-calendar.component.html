<!-- Error State -->
@if (hasError()) {
  <ion-item lines="none" color="danger" class="ion-margin">
    <ion-icon name="alert-circle" slot="start"></ion-icon>
    <ion-label>
      <h3>{{ error() }}</h3>
      <p>Please try again later</p>
    </ion-label>
  </ion-item>
}

<!-- Calendar Content -->
@if (!hasError()) {
  <!-- Calendar Header -->
  @if (active(); as activeItem) {
    <ion-item lines="none" class="ion-text-center">
      <ion-label>
        <h2>{{ activeItem.month.long }} {{ activeItem.date | date: 'yyyy' }}</h2>
      </ion-label>
    </ion-item>
  }

  <!-- Calendar Navigation -->
  <div class="calendar-swiper-container ion-padding-horizontal">
    <app-swiper-container
      #swiper
      [initialSlide]="6"
      [slidesPerView]="7"
      [spaceBetween]="4"
      [centeredSlides]="true"
      (slideChange)="onSlideChange()"
      class="swiper"
    >
      @for (item of items(); track item.text; let i = $index) {
        <swiper-slide class="swiper-slide">
          <button
            type="button"
            [ngClass]="{
              'has-notice': hasNotice(item, feeds()),
              'is-active': isSelected(item),
              'is-today': isToday(item)
            }"
            (click)="slideTo(i)"
            [attr.aria-label]="dayLabel(item)"
            [attr.aria-pressed]="isSelected(item)"
            class="ion-activatable ripple-parent calendar-day"
          >
            <span class="day-short">{{ item.day.short }}</span>
            <span class="day-number">{{ item.day.num }}</span>
            @if (hasNotice(item, feeds())) {
              <span class="notice-indicator" aria-hidden="true"></span>
            }
            <ion-ripple-effect></ion-ripple-effect>
          </button>
        </swiper-slide>
      }
    </app-swiper-container>

    <!-- Navigation buttons with improved accessibility -->
    <ion-button
      fill="clear"
      color="dark"
      class="end action-btn"
      (click)="slideNext()"
      [disabled]="!canNavigate()"
      aria-label="Next dates"
    >
      <ion-icon slot="icon-only" name="arrow-forward"></ion-icon>
    </ion-button>
    <ion-button
      fill="clear"
      color="dark"
      class="start action-btn"
      (click)="slidePrev()"
      [disabled]="!canNavigate()"
      aria-label="Previous dates"
    >
      <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
    </ion-button>
  </div>

  <!-- Selected Date Details -->
  @if (stableSelected(); as selectedItem) {
    <div class="ion-padding-top ion-padding-horizontal card-detail-container">
      <app-card-detail [item]="selectedItem"></app-card-detail>
    </div>
  }
}
