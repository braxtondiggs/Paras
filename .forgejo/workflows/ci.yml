name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  FUNCTIONS_NODE_VERSION: '18'

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Typecheck
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run tests
        run: npm test -- --ci --forceExit --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check bundle budget
        run: |
          BUNDLE_SIZE=$(du -sk www/main*.js 2>/dev/null | awk '{print $1}' || echo "0")
          echo "Bundle size: ${BUNDLE_SIZE}KB"
          if [ "$BUNDLE_SIZE" -gt 2048 ]; then
            echo "ERROR: Bundle exceeds 2 MB hard limit (${BUNDLE_SIZE}KB)" && exit 1
          elif [ "$BUNDLE_SIZE" -gt 1843 ]; then
            echo "WARNING: Bundle is approaching the 1.8 MB warning threshold (${BUNDLE_SIZE}KB)"
          fi

  functions:
    name: Functions Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FUNCTIONS_NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: functions

      - name: Lint functions
        run: npm run lint
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Audit app dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit function dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
        working-directory: functions

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [typecheck, test, build, functions, security]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          # Job results are injected via expressions (no jq: the runner image
          # has no jq). A skipped job is not a failure: typecheck/test are
          # skipped on master push (validated by PR) and typecheck/test/build on
          # draft PRs. security is advisory-only and intentionally not gated.
          fail=0
          check() {
            job=$1; result=$2; allow_skip=$3
            if [ "$result" = "success" ]; then return; fi
            if [ "$allow_skip" = "skip-ok" ] && [ "$result" = "skipped" ]; then return; fi
            echo "❌ $job failed (result: $result)"
            fail=1
          }
          check typecheck "${{ needs.typecheck.result }}" skip-ok
          check test "${{ needs.test.result }}" skip-ok
          check build "${{ needs.build.result }}" skip-ok
          check functions "${{ needs.functions.result }}" required
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✅ All CI checks passed"
