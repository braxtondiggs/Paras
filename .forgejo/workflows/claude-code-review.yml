name: Claude Code Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths:
      - 'src/**'
      - 'functions/src/**'
      - '*.json'
      - '*.md'

jobs:
  claude-review:
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, '[skip-review]') &&
        !contains(github.event.pull_request.title, '[WIP]')
      )

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ast-grep
        run: npm i -g @ast-grep/cli

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for Paras (ASP NYC) — an Angular 17 + Ionic 7 + Capacitor 5 mobile app backed entirely by Firebase (Firestore, Auth, Cloud Functions, FCM).

            This app tells NYC drivers when alternate-side parking rules are suspended. A bug in schedule data or notifications could cause a user to get a parking ticket. Treat data correctness and notification reliability as the two highest-priority concerns.

            Conventions are in CLAUDE.md and .claude/settings.json rules — read them when context is unclear.

            === YOUR JOB ===
            Post INLINE review comments using `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) on specific file:line locations.
            Leave ZERO summary/overview/approval comments. Do NOT post top-level comments.
            If you find nothing worth flagging, post nothing — silence is a valid and preferred outcome.

            === WHAT TO FLAG (priority order) ===
            1. **Data correctness** — errors in how NYC Open Data API responses are parsed or mapped to Firestore documents (`functions/src/index.ts`), wrong date filtering in `FeedService`, timezone bugs (NYC is ET — UTC/ET off-by-one is a parking ticket for the user).
            2. **Notification reliability** — FCM token lifecycle bugs in `app.component.ts`, scheduling logic errors in `functions/src/fcm.ts`, notification time fields stored as wrong type (string vs number).
            3. **Bugs** — logic errors, null/undefined misses, race conditions, wrong exception handling.
            4. **Security** — secrets in logs, missing input validation at system boundaries.
            5. **Angular violations** — `NgModule` usage (standalone only), Firestore calls outside `FeedService`, `new Date()` / `moment` / `date-fns` (use `dayjs`), `any` without justification, missing `Capacitor.isNativePlatform()` guard on native-only APIs.
            6. **God files** — any file mixing multiple concerns or approaching 200 lines. Flag it and suggest a split rather than adding more code.
            7. **Breaking changes** — Firestore document schema changes that affect all production users, App ID (`com.cymbit.paras`) modifications.
            8. **Bundle size** — new dependencies that could push the initial bundle past 1.8 MB.

            === WHAT NOT TO FLAG ===
            - Style/formatting
            - "Consider extracting to a helper" unless it hits the 200-line limit
            - Praise or encouragement
            - Restating what the diff does
            - Speculation or "you might want to consider" nits
            - Suggestions already addressed in later commits of the same PR (on `synchronize` events, verify against current HEAD)

            === COMMENT FORMAT ===
            Each inline comment must include:
            - **Severity**: `[CRITICAL]` / `[HIGH]` / `[MEDIUM]` / `[LOW]` prefix
            - **What**: the specific problem (one sentence)
            - **Why**: concrete failure mode or risk — for data/notification bugs, describe the user impact
            - **Fix**: suggested change (use suggestion blocks ```suggestion ... ``` when the fix is a direct line replacement)

            === BEFORE COMMENTING ===
            - Use `Grep` to verify a "missing" function actually doesn't exist elsewhere
            - Use `Read` to check surrounding context beyond the diff hunk
            - Before flagging a renamed/removed symbol, run `sg -p 'oldName($$$)' src functions` to confirm no remaining callers
            - Do NOT run tests or lint — CI handles that in a separate job

            === SYNCHRONIZE EVENTS ===
            On re-review, comment only on:
            - NEW issues introduced in the new commits
            - Previously-raised issues NOT yet fixed at current HEAD
            Never repeat feedback already addressed.

            === BANNED OUTPUTS ===
            Do not produce any of these:
            - "Overall this PR looks good"
            - "Strengths:" / "Observations:" / "Summary:" sections
            - Approvals or sign-offs
            - Top-level (non-inline) PR comments

          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff*),Bash(git log*),Bash(sg*),Bash(ast-grep*),Grep,Read"
