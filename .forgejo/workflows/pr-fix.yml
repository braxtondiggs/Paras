name: PR review fix (Claude)

# Review-fix loop for agent PRs: when a review with findings is submitted on an ai/* PR (by the bot reviewer or a
# human), the agent resumes on that branch, addresses the comments, pushes a fix commit and labels the PR
# ai-handed-off. The push re-triggers pr-review.yml; scripts/pr-fix.sh caps the rounds so this cannot loop forever.

on:
  # Primary path: pr-review.yml dispatches this with the PR and review id after posting findings.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number'
        required: true
      review_id:
        description: 'Review id to address (default: latest non-approved review)'
        required: false
  # Also fires directly if this Forgejo delivers review events (not documented; harmless if it does not).
  pull_request_review:
    types: [submitted]

concurrency:
  group: pr-fix-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  fix:
    if: vars.AGENT_PAUSED != '1' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'ai/'))
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    timeout-minutes: 60
    env:
      AGENT_MODEL: claude-opus-5-5
      AGENT_EFFORT: high
      AGENT_TIME_LIMIT: 25m
      MAX_FIX_ROUNDS: '2'
      CHECK_CMD: npm run typecheck && npm run lint:check && npm test && npx ng build --configuration development
      CI: 'true'
      NX_DAEMON: 'false'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: |
          apt-get update -qq && apt-get install -y -qq jq >/dev/null
          npm install -g @anthropic-ai/claude-code >/dev/null
          claude --version

      - name: Address review comments
        env:
          TOKEN: ${{ secrets.AGENT_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          REVIEW_ID: ${{ github.event.review.id || inputs.review_id }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          NOTIFY_FORMAT: ${{ vars.NOTIFY_FORMAT }}
        # Always run the script from master so a PR cannot change how it gets fixed.
        run: |
          git fetch -q origin master
          git show origin/master:scripts/pr-fix.sh > /tmp/pr-fix.sh
          bash /tmp/pr-fix.sh
