name: PR review (Claude)

# Forgejo-native PR review: runs Claude Code headless on every PR and posts the result as a Forgejo review.
# Reviews every PR with Claude Code in print mode and posts the findings through the Forgejo API.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.AGENT_PAUSED != '1' # same pause switch as the agent
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    timeout-minutes: 30
    env:
      REVIEW_MODEL: claude-sonnet-5-5
      DISABLE_AUTOUPDATER: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: |
          apt-get update -qq && apt-get install -y -qq jq >/dev/null
          npm install -g @anthropic-ai/claude-code >/dev/null
          claude --version

      - name: Review
        env:
          TOKEN: ${{ secrets.AGENT_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          NOTIFY_FORMAT: ${{ vars.NOTIFY_FORMAT }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }} # optional: ntfy access token (Bearer); leave unset for user:pass-in-URL or open topics
        # Always run the reviewer from master so a PR cannot change how it gets reviewed.
        run: |
          git fetch -q origin master
          git show origin/master:scripts/pr-review.sh > /tmp/pr-review.sh
          bash /tmp/pr-review.sh
