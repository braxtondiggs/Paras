name: 🚀 Deployment Pipeline

on:
  push:
    branches: [master, dev]
    paths:
      - 'functions/**'
      - 'src/**'
      - 'package.json'
      - '.forgejo/workflows/**'
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Select deployment target'
        required: true
        default: 'functions'
        type: choice
        options:
          - functions
          - android
          - all

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # Quality Checks
  quality-checks:
    name: 🔍 Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📂 Install dependencies
        run: npm ci

      - name: 🧹 Lint check
        run: npm run lint:check

      - name: 🧪 Run tests
        run: npm run test:coverage

  # Firebase Functions Deploy
  functions-deploy:
    name: ⚡ Functions Deployment
    runs-on: ubuntu-latest
    needs: quality-checks
    if: |
      (github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'functions' || github.event.inputs.deploy_target == 'all'))
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Functions require Node 18
          cache: 'npm'

      - name: 📂 Install main dependencies
        run: npm ci

      - name: 📂 Install functions dependencies
        run: |
          cd functions
          npm ci

      - name: 🏗️ Build functions
        run: |
          cd functions
          npm run build

      - name: 🔥 Deploy Firebase Functions
        run: |
          cd functions
          npm run deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # Android Build
  android-build:
    name: 🤖 Android Build
    runs-on: ubuntu-latest
    needs: quality-checks
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'android' || github.event.inputs.deploy_target == 'all')) ||
      (github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[android]'))
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📂 Install dependencies
        run: npm ci

      - name: 🏗️ Build for Android
        run: npm run build:android

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 📱 Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📱 Build release AAB (if master)
        if: github.ref == 'refs/heads/master'
        run: |
          cd android
          ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: 📤 Upload AAB artifact (if master)
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab

