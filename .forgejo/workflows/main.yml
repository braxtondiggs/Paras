name: 🚀 Deployment Pipeline

# Manual-dispatch only. Lint/test/build on push are owned by ci.yml; this
# pipeline handles deploys and is triggered intentionally to avoid duplicate
# runs (and duplicate failures) on every push.
on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Select deployment target'
        required: true
        default: 'functions'
        type: choice
        options:
          - functions
          - android
          - all

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # Quality Checks
  quality-checks:
    name: 🔍 Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📂 Install dependencies
        run: npm ci

      - name: 🧹 Lint check
        run: npm run lint:check

      - name: 🧪 Run tests
        run: npm run test:coverage

  # Firebase Functions Deploy
  # TEMPORARILY DISABLED: set `if: false` to skip deploys for now.
  # To re-enable, restore the trigger condition below.
  functions-deploy:
    name: ⚡ Functions Deployment
    runs-on: ubuntu-latest
    needs: quality-checks
    if: false
    # if: |
    #   (github.ref == 'refs/heads/master') ||
    #   (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'functions' || github.event.inputs.deploy_target == 'all'))
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Functions require Node 18
          cache: npm

      - name: 📂 Install main dependencies
        run: npm ci

      - name: 📂 Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: 🏗️ Build functions
        run: npm run build
        working-directory: functions

      - name: 🛠️ Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔥 Deploy Firebase Functions
        run: firebase deploy --only functions --non-interactive
        working-directory: functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # Android Build
  android-build:
    name: 🤖 Android Build
    runs-on: ubuntu-latest
    needs: quality-checks
    # Dispatch-only workflow: run when android (or all) is selected.
    if: github.event.inputs.deploy_target == 'android' || github.event.inputs.deploy_target == 'all'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📂 Install dependencies
        run: npm ci

      - name: 🏗️ Build web + sync Android
        run: npm run build

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 📱 Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: 📱 Build release AAB (if master)
        if: github.ref == 'refs/heads/master'
        run: ./gradlew bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: 📤 Upload AAB artifact (if master)
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
