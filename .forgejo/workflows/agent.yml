name: Local agent

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours (server time, usually UTC)
  workflow_dispatch: # "Run workflow" button
  issues:
    types: [labeled] # start right away when ai-ready is added

concurrency:
  group: local-agent # one agent job at a time (one model on the Mac)
  cancel-in-progress: false

jobs:
  agent:
    if: github.event_name != 'issues' || github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    timeout-minutes: 300
    env:
      OLLAMA_URL: ${{ vars.OLLAMA_URL }} # http://192.168.1.215:11434
      AGENT_MODEL: qwen3-coder-32k
      BASE_BRANCH: dev
      MAX_ISSUES: '2' # issues per run
      PR_CAP: '2' # stop if this many ai/* PRs are open
      REVIEW_PASS: '1' # second Pi pass that reviews its own diff
      CHECK_CMD: npm run typecheck && npm run lint && npm run test
      PI_OFFLINE: '1'
      CI: 'true'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_TOKEN }}
          fetch-depth: 0

      - name: Install tools + point Pi at the Mac mini
        run: |
          apt-get update -qq && apt-get install -y -qq jq >/dev/null
          # If your unit tests run in a real browser (Karma), uncomment:
          # apt-get install -y -qq chromium >/dev/null && echo "CHROME_BIN=/usr/bin/chromium" >> "$GITHUB_ENV"
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent >/dev/null
          mkdir -p ~/.pi/agent
          jq -n --arg url "$OLLAMA_URL/v1" --arg m "$AGENT_MODEL" '{
            providers: { ollama: {
              baseUrl: $url, api: "openai-completions", apiKey: "ollama",
              models: [{ id: $m, name: "Qwen3-Coder 30B (Mac mini)", contextWindow: 32768, maxTokens: 8192 }]
            } } }' > ~/.pi/agent/models.json
          jq -n --arg m "$AGENT_MODEL" '{defaultProvider: "ollama", defaultModel: $m}' > ~/.pi/agent/settings.json
          pi --version

      - name: Work ai-ready issues
        env:
          TOKEN: ${{ secrets.AGENT_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: bash scripts/agent.sh
